<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stringo — Guitar Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #888480;
    --subtle: #4a4745;
    --accent: #e8622a;
    --accent-dim: rgba(232,98,42,0.12);
    --green: #3ecf8e;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --cell-w: 28px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle); display: inline-block; margin-right: 8px; }
  .status-dot.live { background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
  .status-text { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  .upload-zone { border: 1.5px dashed var(--border2); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 2rem; position: relative; overflow: hidden; }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-dim); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 32px; margin-bottom: 1rem; opacity: 0.4; }
  .upload-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .upload-sub { font-size: 12px; color: var(--muted); }

  #player-section { display: none; margin-bottom: 1.5rem; }
  .player-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
  .player-name { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  audio { display: none; }
  .play-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: background 0.15s; }
  .play-btn:hover { background: var(--accent); border-color: var(--accent); }
  .progress-wrap { flex: 3; height: 4px; background: var(--surface2); border-radius: 2px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
  .time-label { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; min-width: 36px; }

  .analyze-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: var(--mono); font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: 0.04em; transition: opacity 0.2s; margin-bottom: 2rem; display: none; }
  .analyze-btn:hover { opacity: 0.85; }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .spinner-wrap { display: none; text-align: center; padding: 3rem; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #tabs-section { display: none; }
  .tabs-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; gap: 10px; flex-wrap: wrap; }
  .tabs-title { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .tabs-meta { font-family: var(--mono); font-size: 11px; color: var(--subtle); }
  .tabs-controls { display: flex; gap: 8px; }
  .ctrl-btn { font-family: var(--mono); font-size: 11px; padding: 5px 12px; border: 1px solid var(--border2); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* TAB BOARD */
  .tab-board-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tab-viewport { overflow-x: auto; overflow-y: hidden; padding: 1.25rem 1.25rem 0.5rem; position: relative; }
  .tab-viewport::-webkit-scrollbar { height: 4px; }
  .tab-viewport::-webkit-scrollbar-track { background: var(--surface2); }
  .tab-viewport::-webkit-scrollbar-thumb { background: var(--subtle); border-radius: 2px; }
  .tab-inner { position: relative; display: inline-block; }

  /* PLAYHEAD */
  .playhead-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    z-index: 10;
    pointer-events: none;
    left: 28px;
    box-shadow: 0 0 10px rgba(232,98,42,0.7);
  }

  .tab-fret-nums { display: flex; margin-left: 28px; margin-bottom: 6px; }
  .tab-fnum { width: var(--cell-w); text-align: center; font-family: var(--mono); font-size: 9px; color: var(--subtle); flex-shrink: 0; }
  .tab-fnum.beat { color: var(--muted); }

  .tab-string-row { display: flex; align-items: center; margin-bottom: 5px; }
  .tab-str-label { font-family: var(--mono); font-size: 13px; font-weight: 500; width: 22px; text-align: right; margin-right: 6px; flex-shrink: 0; }
  .s0{color:#e8622a} .s1{color:#378ADD} .s2{color:#639922} .s3{color:#BA7517} .s4{color:#D4537E} .s5{color:#7F77DD}

  .tab-cells { display: flex; }
  .tab-cell { position: relative; width: var(--cell-w); height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tab-cell-line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border2); transform: translateY(-50%); }
  .tab-cell-nut { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--text); border-radius: 1px; }

  .tab-note { position: relative; z-index: 2; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; font-weight: 500; }
  .tab-note.filled { background: var(--accent); color: #fff; }
  .tab-note.open   { background: var(--text); color: var(--bg); }

  /* active column highlight */
  .tab-cell.active-col .tab-cell-line { background: rgba(232,98,42,0.35); }
  .tab-cell.active-col .tab-note { box-shadow: 0 0 8px rgba(232,98,42,0.9); transform: scale(1.2); }

  /* current note bar */
  .current-note-bar { background: var(--surface2); border-top: 1px solid var(--border); padding: 0.6rem 1.25rem; font-family: var(--mono); font-size: 12px; color: var(--muted); display: none; gap: 2rem; align-items: center; }
  .current-note-bar b { color: var(--accent); font-weight: 500; }

  .ascii-out { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem 1.25rem; font-family: var(--mono); font-size: 12px; color: var(--text); line-height: 1.9; overflow-x: auto; white-space: pre; margin-top: 1rem; }

  .note-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 1rem; }
  .note-chip { font-family: var(--mono); font-size: 11px; padding: 4px 10px; border-radius: 6px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .note-chip b { color: var(--text); font-weight: 500; }
  .empty-state { text-align: center; padding: 3rem 2rem; color: var(--subtle); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">String<span>o</span></div>
  <div>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">готов к работе</span>
  </div>
</header>

<main>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac">
    <div class="upload-icon">🎵</div>
    <div class="upload-title">Перетащи аудиофайл сюда</div>
    <div class="upload-sub">MP3, WAV, OGG — любой формат</div>
  </div>

  <div id="player-section">
    <div class="player-bar">
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <span class="player-name" id="player-name">—</span>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time-label" id="time-label">0:00</span>
    </div>
    <audio id="audio-player"></audio>
  </div>

  <button class="analyze-btn" id="analyze-btn" onclick="analyzeFile()">
    Анализировать → получить табы
  </button>

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    запускаю basic-pitch...
  </div>

  <div id="tabs-section">
    <div class="tabs-header">
      <div>
        <div class="tabs-title">Guitar tabs</div>
        <div class="tabs-meta" id="tabs-meta"></div>
      </div>
      <div class="tabs-controls">
        <button class="ctrl-btn active" id="btn-visual" onclick="switchView('visual')">Визуал</button>
        <button class="ctrl-btn" id="btn-ascii" onclick="switchView('ascii')">ASCII</button>
        <button class="ctrl-btn" id="btn-copy" onclick="copyAscii()">Копировать</button>
      </div>
    </div>

    <div class="tab-board-wrap" id="tab-board-wrap">
      <div class="tab-viewport" id="tab-viewport">
        <div class="tab-inner" id="tab-inner">
          <div class="playhead-line" id="playhead"></div>
          <div id="tab-board"></div>
        </div>
      </div>
      <div class="current-note-bar" id="current-note-bar">
        <span>Струна: <b id="cn-string">—</b></span>
        <span>Лад: <b id="cn-fret">—</b></span>
        <span>Время: <b id="cn-time">—</b></span>
      </div>
    </div>

    <pre class="ascii-out" id="ascii-out"></pre>
    <div class="note-chips" id="note-chips"></div>
  </div>

</main>

<script>
const API_URL      = 'http://localhost:8000/analyze'
const STRING_NAMES = ['e','B','G','D','A','E']
const OPEN_MIDI    = [64,59,55,50,45,40]
const NOTE_NAMES   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
const CELL_W       = 28

let currentFile = null
let tabsData    = []
let maxTime     = 0
let totalCols   = 0
let rafId       = null
let lastCol     = -1

// ── UPLOAD ──
const uploadZone = document.getElementById('upload-zone')
const fileInput  = document.getElementById('file-input')

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover') })
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'))
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('dragover')
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0])
})
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]) })

function handleFile(file) {
  currentFile = file
  document.getElementById('player-section').style.display = 'block'
  document.getElementById('player-name').textContent = file.name
  document.getElementById('analyze-btn').style.display = 'block'

  const audio = document.getElementById('audio-player')
  audio.src = URL.createObjectURL(file)
  audio.addEventListener('timeupdate', onTimeUpdate)
  audio.addEventListener('ended', () => { document.getElementById('play-btn').textContent = '▶'; cancelAnimationFrame(rafId) })

  document.getElementById('progress-wrap').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect()
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration
    if (!audio.paused) movePlayhead()
  }
  setStatus('live', file.name + ' загружен')
}

function togglePlay() {
  const audio = document.getElementById('audio-player')
  const btn   = document.getElementById('play-btn')
  if (audio.paused) {
    audio.play()
    btn.textContent = '⏸'
    startPlayhead()
  } else {
    audio.pause()
    btn.textContent = '▶'
    cancelAnimationFrame(rafId)
  }
}

function onTimeUpdate() {
  const audio = document.getElementById('audio-player')
  const pct   = audio.duration ? audio.currentTime / audio.duration * 100 : 0
  document.getElementById('progress-fill').style.width = pct + '%'
  const m = Math.floor(audio.currentTime / 60)
  const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0')
  document.getElementById('time-label').textContent = m + ':' + s
}

// ── PLAYHEAD ──
function startPlayhead() {
  cancelAnimationFrame(rafId)
  function frame() { movePlayhead(); rafId = requestAnimationFrame(frame) }
  rafId = requestAnimationFrame(frame)
}

function movePlayhead() {
  if (!tabsData.length || !maxTime) return
  const audio    = document.getElementById('audio-player')
  const t        = audio.currentTime
  const viewport = document.getElementById('tab-viewport')
  const ph       = document.getElementById('playhead')

  const labelW = 28
  const ratio  = Math.min(t / maxTime, 1)
  const px     = labelW + ratio * (totalCols * CELL_W)

  ph.style.left = px + 'px'

  // auto-scroll to keep playhead centered
  const vpW = viewport.clientWidth
  viewport.scrollLeft = Math.max(0, px - vpW / 2)

  // highlight column
  const col = Math.round(ratio * (totalCols - 1))
  if (col !== lastCol) {
    document.querySelectorAll('.tab-cell.active-col').forEach(el => el.classList.remove('active-col'))
    document.querySelectorAll(`.tab-cell[data-col="${col}"]`).forEach(el => el.classList.add('active-col'))
    lastCol = col
  }

  // current note info
  let closest = null, minDiff = Infinity
  tabsData.forEach(note => {
    const diff = Math.abs(note.time - t)
    if (diff < minDiff) { minDiff = diff; closest = note }
  })
  if (closest && minDiff < 1.5) {
    document.getElementById('cn-string').textContent = STRING_NAMES[closest.string - 1]
    document.getElementById('cn-fret').textContent   = closest.fret === 0 ? '0 (открытая)' : closest.fret
    document.getElementById('cn-time').textContent   = closest.time.toFixed(2) + 's'
  }
}

// ── ANALYZE ──
async function analyzeFile() {
  if (!currentFile) return
  const btn = document.getElementById('analyze-btn')
  btn.disabled = true
  document.getElementById('spinner').style.display = 'block'
  document.getElementById('tabs-section').style.display = 'none'
  setStatus('', 'анализирую...')

  const formData = new FormData()
  formData.append('file', currentFile)

  try {
    const res  = await fetch(API_URL, { method: 'POST', body: formData })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const data = await res.json()
    tabsData = data.tabs
    renderAll(data)
    setStatus('live', 'готово · ' + tabsData.length + ' нот')
  } catch (err) {
    console.warn('Демо-режим:', err.message)
    tabsData = demoTabs()
    renderAll({ tabs: tabsData, total_notes: tabsData.length })
    setStatus('', 'демо-режим')
  } finally {
    document.getElementById('spinner').style.display = 'none'
    btn.disabled = false
  }
}

function demoTabs() {
  return [
    {string:4,fret:0,time:0.0},{string:4,fret:3,time:0.4},{string:4,fret:5,time:0.8},
    {string:4,fret:3,time:1.2},{string:4,fret:0,time:1.6},{string:4,fret:3,time:2.0},
    {string:4,fret:6,time:2.4},{string:4,fret:5,time:2.8},
    {string:3,fret:0,time:3.2},{string:3,fret:2,time:3.6},{string:3,fret:3,time:4.0},
    {string:2,fret:0,time:4.4},{string:1,fret:0,time:4.8},{string:1,fret:3,time:5.2},
  ]
}

// ── RENDER ──
function renderAll(data) {
  document.getElementById('tabs-section').style.display = 'block'
  document.getElementById('current-note-bar').style.display = 'flex'
  document.getElementById('tabs-meta').textContent = data.tabs.length + ' нот · ' + data.total_notes + ' событий'
  buildChips(data.tabs)
  renderVisual(data.tabs)
  renderAscii(data.tabs)
}

function renderVisual(tabs) {
  const board = document.getElementById('tab-board')
  board.innerHTML = ''
  if (!tabs.length) { board.innerHTML = '<div class="empty-state">Нот не найдено</div>'; return }

  maxTime   = Math.max(...tabs.map(t => t.time)) || 1
  totalCols = Math.max(64, Math.ceil(maxTime * 8))

  // map notes to grid
  const grid = {}
  tabs.forEach(note => {
    const col = Math.round((note.time / maxTime) * (totalCols - 1))
    const si  = note.string - 1
    if (!grid[si]) grid[si] = {}
    grid[si][col] = note.fret
  })

  // time labels row
  const fnums = document.createElement('div')
  fnums.className = 'tab-fret-nums'
  for (let c = 0; c < totalCols; c++) {
    const d = document.createElement('div')
    d.className = 'tab-fnum' + (c % 8 === 0 ? ' beat' : '')
    d.textContent = c % 8 === 0 ? Math.round((c / totalCols) * maxTime) + 's' : ''
    fnums.appendChild(d)
  }
  board.appendChild(fnums)

  // string rows
  STRING_NAMES.forEach((name, si) => {
    const row = document.createElement('div')
    row.className = 'tab-string-row'

    const lbl = document.createElement('div')
    lbl.className = 'tab-str-label s' + si
    lbl.textContent = name
    row.appendChild(lbl)

    const cells = document.createElement('div')
    cells.className = 'tab-cells'

    for (let c = 0; c < totalCols; c++) {
      const cell = document.createElement('div')
      cell.className = 'tab-cell'
      cell.dataset.col = c

      const line = document.createElement('div')
      line.className = 'tab-cell-line'
      cell.appendChild(line)

      if (c === 0) {
        const nut = document.createElement('div')
        nut.className = 'tab-cell-nut'
        cell.appendChild(nut)
      }

      const fret = grid[si] && grid[si][c] !== undefined ? grid[si][c] : null
      if (fret !== null) {
        const badge = document.createElement('div')
        badge.className = 'tab-note ' + (fret === 0 ? 'open' : 'filled')
        badge.textContent = fret
        cell.appendChild(badge)
      }
      cells.appendChild(cell)
    }
    row.appendChild(cells)
    board.appendChild(row)
  })

  // set total width for playhead to travel
  const totalW = 28 + totalCols * CELL_W
  document.getElementById('tab-inner').style.width = totalW + 'px'
}

function renderAscii(tabs) {
  if (!tabs.length || !maxTime) return
  const grid = {}
  tabs.forEach(note => {
    const col = Math.round((note.time / maxTime) * (totalCols - 1))
    const si  = note.string - 1
    if (!grid[si]) grid[si] = {}
    grid[si][col] = note.fret
  })
  const lines = STRING_NAMES.map((name, si) => {
    let row = name + ' |'
    for (let c = 0; c < totalCols; c++) {
      const f = grid[si] && grid[si][c] !== undefined ? grid[si][c] : null
      row += f !== null ? (String(f).length === 1 ? '-' + f + '-' : f + '-') : '---'
    }
    return row + '|'
  })
  document.getElementById('ascii-out').textContent = lines.join('\n')
}

function buildChips(tabs) {
  const chips = document.getElementById('note-chips')
  chips.innerHTML = ''
  const counts = {}
  tabs.forEach(t => { counts[t.string] = (counts[t.string] || 0) + 1 })
  STRING_NAMES.forEach((name, si) => {
    if (!counts[si + 1]) return
    const chip = document.createElement('div')
    chip.className = 'note-chip'
    chip.innerHTML = '<b>' + name + '</b> · ' + counts[si + 1] + ' нот'
    chips.appendChild(chip)
  })
  if (tabs.length) {
    const minF = Math.min(...tabs.map(t => t.fret))
    const maxF = Math.max(...tabs.map(t => t.fret))
    const chip = document.createElement('div')
    chip.className = 'note-chip'
    chip.innerHTML = 'Лады <b>' + minF + '–' + maxF + '</b>'
    chips.appendChild(chip)
  }
}

function switchView(v) {
  document.getElementById('tab-board-wrap').style.display = v === 'visual' ? 'block' : 'none'
  document.getElementById('ascii-out').style.display      = v === 'ascii'  ? 'block' : 'none'
  document.getElementById('btn-visual').classList.toggle('active', v === 'visual')
  document.getElementById('btn-ascii').classList.toggle('active',  v === 'ascii')
}

function copyAscii() {
  navigator.clipboard.writeText(document.getElementById('ascii-out').textContent).then(() => {
    const btn = document.getElementById('btn-copy')
    btn.textContent = 'Скопировано!'; btn.classList.add('active')
    setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('active') }, 1500)
  })
}

function setStatus(type, msg) {
  document.getElementById('status-dot').className = 'status-dot' + (type === 'live' ? ' live' : '')
  document.getElementById('status-text').textContent = msg
}
</script>
</body>
</html>
