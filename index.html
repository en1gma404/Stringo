<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stringo — Guitar Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #888480;
    --subtle: #4a4745;
    --accent: #e8622a;
    --accent-dim: rgba(232,98,42,0.12);
    --green: #3ecf8e;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--subtle);
    display: inline-block;
    margin-right: 8px;
  }

  .status-dot.live { background: var(--green); animation: pulse 2s infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── LAYOUT ── */
  main { max-width: 980px; margin: 0 auto; padding: 2rem; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 1.5px dashed var(--border2);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .upload-zone input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }

  .upload-icon {
    font-size: 32px;
    margin-bottom: 1rem;
    opacity: 0.4;
  }

  .upload-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }

  .upload-sub { font-size: 12px; color: var(--muted); }

  /* ── PLAYER ── */
  #player-section { display: none; margin-bottom: 2rem; }

  .player-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .player-name {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  audio { display: none; }

  .play-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .play-btn:hover { background: var(--accent); border-color: var(--accent); }

  .progress-wrap {
    flex: 3;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }

  .time-label { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }

  /* ── ANALYZE BTN ── */
  .analyze-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.2s;
    margin-bottom: 2rem;
    display: none;
  }

  .analyze-btn:hover { opacity: 0.85; }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── SPINNER ── */
  .spinner-wrap {
    display: none;
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TABS SECTION ── */
  #tabs-section { display: none; }

  .tabs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: gap;
    gap: 10px;
  }

  .tabs-title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .tabs-meta { font-family: var(--mono); font-size: 11px; color: var(--subtle); }

  .tabs-controls { display: flex; gap: 8px; }

  .ctrl-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .ctrl-btn:hover { color: var(--text); border-color: var(--border2); }
  .ctrl-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* ── TAB BOARD ── */
  .tab-board {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.25rem;
    overflow-x: auto;
    font-family: var(--mono);
  }

  .tab-fret-nums {
    display: flex;
    margin-left: 28px;
    margin-bottom: 6px;
  }

  .tab-fnum {
    width: 36px;
    text-align: center;
    font-size: 10px;
    color: var(--subtle);
    flex-shrink: 0;
  }

  .tab-fnum.beat { color: var(--muted); }

  .tab-string-row {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
  }

  .tab-str-label {
    font-size: 13px;
    font-weight: 500;
    width: 22px;
    text-align: right;
    margin-right: 6px;
    flex-shrink: 0;
  }

  /* string colours */
  .s0 { color: #e8622a; }
  .s1 { color: #378ADD; }
  .s2 { color: #639922; }
  .s3 { color: #BA7517; }
  .s4 { color: #D4537E; }
  .s5 { color: #7F77DD; }

  .tab-cells { display: flex; }

  .tab-cell {
    position: relative;
    width: 36px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .tab-cell-line {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: var(--border2);
    transform: translateY(-50%);
  }

  .tab-cell-nut {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--text);
    border-radius: 1px;
  }

  .tab-note {
    position: relative; z-index: 2;
    min-width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
  }

  .tab-note.filled { background: var(--accent); color: #fff; }
  .tab-note.open   { background: var(--text); color: var(--bg); }

  /* playhead */
  .tab-cell.playhead .tab-cell-line { background: var(--accent); opacity: 0.5; }
  .tab-cell.playhead { background: rgba(232,98,42,0.06); }

  /* ── ASCII OUTPUT ── */
  .ascii-out {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.25rem;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    line-height: 1.8;
    overflow-x: auto;
    white-space: pre;
    margin-top: 1rem;
  }

  /* ── NOTE INFO ── */
  .note-chips {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 1rem;
  }

  .note-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .note-chip b { color: var(--text); font-weight: 500; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--subtle);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">String<span>o</span></div>
  <div>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">готов к работе</span>
  </div>
</header>

<main>

  <!-- UPLOAD -->
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac">
    <div class="upload-icon">🎵</div>
    <div class="upload-title">Перетащи аудиофайл сюда</div>
    <div class="upload-sub">MP3, WAV, OGG — любой формат</div>
  </div>

  <!-- PLAYER -->
  <div id="player-section">
    <div class="player-bar">
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <span class="player-name" id="player-name">—</span>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time-label" id="time-label">0:00</span>
    </div>
    <audio id="audio-player"></audio>
  </div>

  <!-- ANALYZE -->
  <button class="analyze-btn" id="analyze-btn" onclick="analyzeFile()">
    Анализировать → получить табы
  </button>

  <!-- SPINNER -->
  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    запускаю basic-pitch...
  </div>

  <!-- TABS -->
  <div id="tabs-section">
    <div class="tabs-header">
      <div>
        <div class="tabs-title">Guitar tabs</div>
        <div class="tabs-meta" id="tabs-meta"></div>
      </div>
      <div class="tabs-controls">
        <button class="ctrl-btn active" id="btn-visual" onclick="switchView('visual')">Визуал</button>
        <button class="ctrl-btn" id="btn-ascii" onclick="switchView('ascii')">ASCII</button>
        <button class="ctrl-btn" id="btn-copy" onclick="copyAscii()">Копировать</button>
      </div>
    </div>

    <div class="tab-board" id="tab-board"></div>
    <pre class="ascii-out" id="ascii-out"></pre>

    <div class="note-chips" id="note-chips"></div>
  </div>

</main>

<script>
// ── CONFIG ──
const API_URL = 'http://localhost:8000/analyze'

// ── STATE ──
let currentFile = null
let tabsData = []
let viewMode = 'visual'
let playheadCol = -1
let playInterval = null

// ── STRING INFO ──
const STRING_NAMES = ['e', 'B', 'G', 'D', 'A', 'E']
const OPEN_MIDI    = [64, 59, 55, 50, 45, 40]
const NOTE_NAMES   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']

function midiToName(m) {
  return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1)
}

// ── UPLOAD ──
const uploadZone = document.getElementById('upload-zone')
const fileInput  = document.getElementById('file-input')

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover') })
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'))
uploadZone.addEventListener('drop', e => {
  e.preventDefault()
  uploadZone.classList.remove('dragover')
  const f = e.dataTransfer.files[0]
  if (f) handleFile(f)
})
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]) })

function handleFile(file) {
  currentFile = file
  const url = URL.createObjectURL(file)

  // показываем плеер
  document.getElementById('player-section').style.display = 'block'
  document.getElementById('player-name').textContent = file.name
  document.getElementById('analyze-btn').style.display = 'block'

  const audio = document.getElementById('audio-player')
  audio.src = url
  audio.addEventListener('timeupdate', updateProgress)
  audio.addEventListener('ended', () => {
    document.getElementById('play-btn').textContent = '▶'
    clearInterval(playInterval)
  })

  // progress click
  document.getElementById('progress-wrap').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect()
    const ratio = (e.clientX - r.left) / r.width
    audio.currentTime = ratio * audio.duration
  }

  setStatus('live', file.name + ' загружен')
}

function togglePlay() {
  const audio = document.getElementById('audio-player')
  const btn = document.getElementById('play-btn')
  if (audio.paused) { audio.play(); btn.textContent = '⏸' }
  else { audio.pause(); btn.textContent = '▶' }
}

function updateProgress() {
  const audio = document.getElementById('audio-player')
  const pct = audio.duration ? (audio.currentTime / audio.duration * 100) : 0
  document.getElementById('progress-fill').style.width = pct + '%'
  const m = Math.floor(audio.currentTime / 60)
  const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0')
  document.getElementById('time-label').textContent = m + ':' + s
}

// ── ANALYZE ──
async function analyzeFile() {
  if (!currentFile) return

  const btn = document.getElementById('analyze-btn')
  btn.disabled = true
  document.getElementById('spinner').style.display = 'block'
  document.getElementById('tabs-section').style.display = 'none'
  setStatus('', 'анализирую...')

  const formData = new FormData()
  formData.append('file', currentFile)

  try {
    const res = await fetch(API_URL, { method: 'POST', body: formData })
    if (!res.ok) throw new Error('Сервер вернул ' + res.status)
    const data = await res.json()
    tabsData = data.tabs
    renderAll(data)
    setStatus('live', 'готово · ' + tabsData.length + ' нот')
  } catch (err) {
    // ── DEMO MODE (если сервер не запущен) ──
    console.warn('Сервер недоступен, показываю демо-данные:', err.message)
    tabsData = generateDemo()
    renderAll({ tabs: tabsData, total_notes: tabsData.length })
    setStatus('', 'демо-режим (сервер офлайн)')
  } finally {
    document.getElementById('spinner').style.display = 'none'
    btn.disabled = false
  }
}

// ── DEMO DATA GENERATOR ──
function generateDemo() {
  // Smoke on the Water riff + scale
  const pattern = [
    {string:3,fret:0,time:0.0}, {string:3,fret:3,time:0.3}, {string:3,fret:5,time:0.6},
    {string:3,fret:3,time:1.0}, {string:3,fret:0,time:1.3}, {string:3,fret:3,time:1.6},
    {string:3,fret:6,time:1.9}, {string:3,fret:5,time:2.3},
    {string:3,fret:0,time:2.7}, {string:3,fret:3,time:3.0}, {string:3,fret:5,time:3.3},
    {string:3,fret:3,time:3.7}, {string:3,fret:0,time:4.1},
    {string:2,fret:0,time:4.5}, {string:2,fret:2,time:4.8}, {string:2,fret:3,time:5.1},
    {string:1,fret:0,time:5.5}, {string:1,fret:1,time:5.8}, {string:1,fret:3,time:6.1},
    {string:0,fret:0,time:6.5}, {string:0,fret:2,time:6.8}, {string:0,fret:3,time:7.1},
  ]
  return pattern
}

// ── RENDER ──
function renderAll(data) {
  document.getElementById('tabs-section').style.display = 'block'

  const n = data.tabs.length
  document.getElementById('tabs-meta').textContent = n + ' нот · ' + (data.total_notes || n) + ' событий'

  buildChips(data.tabs)
  renderVisual(data.tabs)
  renderAscii(data.tabs)
}

// ── VISUAL TAB ──
function renderVisual(tabs) {
  const board = document.getElementById('tab-board')
  board.innerHTML = ''

  if (!tabs.length) {
    board.innerHTML = '<div class="empty-state">Нот не найдено</div>'
    return
  }

  // Распределяем ноты по временным слотам (колонкам)
  const COLS = 32
  const grid = {} // grid[string][col] = fret

  const maxTime = Math.max(...tabs.map(t => t.time)) || 1
  tabs.forEach(note => {
    const col = Math.round((note.time / maxTime) * (COLS - 1))
    const s = note.string
    if (!grid[s]) grid[s] = {}
    grid[s][col] = note.fret
  })

  // номера колонок
  const fnums = document.createElement('div')
  fnums.className = 'tab-fret-nums'
  for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div')
    d.className = 'tab-fnum' + (c % 4 === 0 ? ' beat' : '')
    d.textContent = c % 4 === 0 ? (c + 1) : ''
    fnums.appendChild(d)
  }
  board.appendChild(fnums)

  // строки
  STRING_NAMES.forEach((name, si) => {
    const row = document.createElement('div')
    row.className = 'tab-string-row'

    const lbl = document.createElement('div')
    lbl.className = 'tab-str-label s' + si
    lbl.textContent = name
    row.appendChild(lbl)

    const cells = document.createElement('div')
    cells.className = 'tab-cells'

    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div')
      cell.className = 'tab-cell'
      cell.title = 'Струна ' + name + ' · позиция ' + (c + 1)

      const line = document.createElement('div')
      line.className = 'tab-cell-line'
      cell.appendChild(line)

      if (c === 0) {
        const nut = document.createElement('div')
        nut.className = 'tab-cell-nut'
        cell.appendChild(nut)
      }

      const fret = grid[si] && grid[si][c] !== undefined ? grid[si][c] : null
      if (fret !== null) {
        const badge = document.createElement('div')
        badge.className = 'tab-note ' + (fret === 0 ? 'open' : 'filled')
        badge.textContent = fret
        const midi = OPEN_MIDI[si] + fret
        badge.title = midiToName(midi)
        cell.appendChild(badge)
      }

      cells.appendChild(cell)
    }

    row.appendChild(cells)
    board.appendChild(row)
  })
}

// ── ASCII TAB ──
function renderAscii(tabs) {
  if (!tabs.length) return

  const COLS = 32
  const maxTime = Math.max(...tabs.map(t => t.time)) || 1
  const grid = {}

  tabs.forEach(note => {
    const col = Math.round((note.time / maxTime) * (COLS - 1))
    const s = note.string
    if (!grid[s]) grid[s] = {}
    grid[s][col] = note.fret
  })

  const lines = STRING_NAMES.map((name, si) => {
    let row = name + ' |'
    for (let c = 0; c < COLS; c++) {
      const f = grid[si] && grid[si][c] !== undefined ? grid[si][c] : null
      if (f !== null) {
        const fs = String(f)
        row += fs.length === 1 ? ('-' + fs + '-') : (fs + '-')
      } else {
        row += '---'
      }
    }
    row += '|'
    return row
  })

  document.getElementById('ascii-out').textContent = lines.join('\n')
}

// ── CHIPS ──
function buildChips(tabs) {
  const chips = document.getElementById('note-chips')
  chips.innerHTML = ''

  const counts = {}
  tabs.forEach(t => { counts[t.string] = (counts[t.string] || 0) + 1 })

  STRING_NAMES.forEach((name, si) => {
    if (!counts[si]) return
    const chip = document.createElement('div')
    chip.className = 'note-chip'
    chip.innerHTML = '<b>' + name + '</b> · ' + counts[si] + ' нот'
    chips.appendChild(chip)
  })

  // диапазон
  if (tabs.length) {
    const minF = Math.min(...tabs.map(t => t.fret))
    const maxF = Math.max(...tabs.map(t => t.fret))
    const chip = document.createElement('div')
    chip.className = 'note-chip'
    chip.innerHTML = 'Лады <b>' + minF + '–' + maxF + '</b>'
    chips.appendChild(chip)
  }
}

// ── VIEW SWITCH ──
function switchView(v) {
  viewMode = v
  document.getElementById('tab-board').style.display = v === 'visual' ? 'block' : 'none'
  document.getElementById('ascii-out').style.display = v === 'ascii' ? 'block' : 'none'
  document.getElementById('btn-visual').classList.toggle('active', v === 'visual')
  document.getElementById('btn-ascii').classList.toggle('active', v === 'ascii')
}

function copyAscii() {
  const text = document.getElementById('ascii-out').textContent
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy')
    btn.textContent = 'Скопировано!'
    btn.classList.add('active')
    setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('active') }, 1500)
  })
}

// ── STATUS ──
function setStatus(type, msg) {
  document.getElementById('status-dot').className = 'status-dot' + (type === 'live' ? ' live' : '')
  document.getElementById('status-text').textContent = msg
}
</script>
</body>
</html>
